<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 2nd Monthsary, Ericha!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating background hearts */
        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-heart {
            position: absolute;
            color: rgba(255, 107, 107, 0.25);
            user-select: none;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-15vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Interactive Envelope Screen */
        .envelope-wrapper {
            position: relative;
            z-index: 10;
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s ease, opacity 0.6s ease;
            max-width: 320px;
            width: 100%;
        }

        .envelope-wrapper:active {
            transform: scale(0.96);
        }

        .envelope {
            width: 100%;
            height: 200px;
            background-color: #ff85a1;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #ff4d6d;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 110px solid #ff4d6d;
            transform-origin: top;
            transition: transform 0.5s ease;
        }

        @media (max-width: 360px) {
            .envelope-flap {
                border-left-width: 140px;
                border-right-width: 140px;
                border-top-width: 95px;
            }
        }

        .envelope-seal {
            width: 50px;
            height: 50px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 2;
            animation: pulse 1.5s infinite;
        }

        .tap-instruction {
            margin-top: 20px;
            color: #ff4d6d;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: bounce 1.8s infinite;
        }

        /* Card styling */
        .card {
            background-color: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #ffe3e3;
            z-index: 5;
            display: none;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: opacity 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card.active {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        h1 {
            color: #ff6b6b;
            font-size: 22px;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        p {
            font-size: 15px;
            line-height: 1.65;
            margin-bottom: 18px;
            text-align: left;
            color: #555555;
        }

        .heart {
            font-size: 34px;
            color: #ff6b6b;
            margin: 15px 0;
            display: inline-block;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            animation: pulse 1.5s infinite;
            transition: transform 0.2s ease;
        }

        .heart:active {
            transform: scale(1.4) !important;
        }

        .signature {
            text-align: right;
            font-weight: bold;
            color: #ff6b6b;
            margin-top: 25px;
            font-size: 16px;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* Tap Floating Burst Hearts */
        .burst-heart {
            position: fixed;
            pointer-events: none;
            font-size: 20px;
            z-index: 100;
            animation: burst 1s ease-out forwards;
        }
